<style>

.annotation,.asset-marker{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1px solid var(--ink);background:#fff;font-weight:700}.asset-marker{width:auto;border-radius:8px;padding:0 7px}

.wf{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}.wf-row{display:flex;gap:12px}.msg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}.msg .who{font-weight:700;font-size:12px}.msg-actions{font-size:12px;color:var(--muted);margin-top:4px}.skeleton{border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center;padding:10px;font-size:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.col{display:grid;gap:10px;align-content:start}.listrow{border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-size:13px}.tabs button.on{background:var(--ink);color:#fff}.slider{height:6px;border-radius:3px;background:var(--wash);border:1px solid var(--line);margin:8px 0}.fold{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.fold>b{display:flex;justify-content:space-between}.avatar{width:56px;height:56px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
/* 手机框 */
.phone{width:min(390px,94vw);margin:0 auto;border:2px solid var(--ink);border-radius:26px;background:#fff;overflow:hidden}.phone .screen{min-height:640px;display:flex;flex-direction:column}.ptop{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700}.pbody{flex:1;padding:12px;overflow:auto}.ptabbar{display:flex;border-top:1px solid var(--line)}.ptabbar button{flex:1;border:0;background:#fff;padding:11px 4px;font-size:12px;border-right:1px solid var(--line)}.ptabbar button:last-child{border-right:0}.ptabbar button.on{font-weight:800;border-top:2px solid var(--ink)}
/* inspector/popup/layers/journey/review */
.inspector{position:fixed;top:0;right:0;bottom:0;width:min(340px,calc(100vw - 20px));z-index:30;border-left:1px solid var(--line);box-shadow:-12px 0 40px #0002;transform:translateX(105%);transition:transform .2s;overflow:auto;background:var(--paper);padding:22px}.inspector.open{transform:none}.inspector h3{margin:0 0 6px}.inspector section{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.popover,.layers,.journey{position:fixed;background:#fff;border:1px solid var(--ink);border-radius:14px;box-shadow:0 12px 40px #0002;z-index:20}.popover{width:min(300px,calc(100vw - 24px));max-height:min(60vh,350px);overflow:auto;padding:16px}.layers{right:20px;top:76px;padding:14px;display:none}.layers.open{display:grid;gap:10px}.journey{right:20px;bottom:20px;width:min(380px,calc(100vw - 20px));max-height:75vh;overflow:auto;padding:18px;display:none}.journey.open{display:block}.journey ol{padding-left:20px}.journey li{padding:8px;border:1px solid var(--line);border-radius:9px;margin:8px 0;list-style-position:inside}.journey-trigger{position:fixed;left:250px;bottom:20px;z-index:10}.hidden{display:none!important}[data-layer="asset"]{display:none}.close{float:right;border:0;background:none;font-size:18px}
.review-layer{position:absolute;inset:0;pointer-events:none;z-index:6}.review-marker{position:absolute;min-width:30px;height:26px;padding:0 8px;border:1.5px solid var(--ink);border-radius:13px 13px 13px 3px;background:repeating-linear-gradient(135deg,#fff,#fff 5px,#efefe9 5px,#efefe9 6px);font-size:11px;font-weight:800;pointer-events:auto}
.review-hint{position:fixed;top:76px;left:50%;translate:-50% 0;z-index:40;background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:12px;display:none;white-space:nowrap}body.review-mode .review-hint{display:block}body.review-mode .content{cursor:crosshair}.review-mode #reviewButton{background:var(--ink);color:#fff}
.popover textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;resize:vertical}.review-item{border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0}.review-item p{margin:4px 0}.review-export{width:100%;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;border:1px dashed var(--line);border-radius:8px;padding:8px;max-height:160px;overflow:auto;background:var(--wash)}
@media(max-width:760px){.app{display:block}.sidebar{border:0;border-bottom:1px solid var(--line);padding:12px;position:sticky;top:0;z-index:7}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.navgroup{display:none}.topbar{top:57px;padding:0 14px}.content{padding:16px}.grid2{grid-template-columns:1fr}.grid5{grid-template-columns:repeat(3,1fr)}.journey{left:10px;right:10px;bottom:10px;width:auto;max-height:68vh}.journey-trigger{left:12px;bottom:12px}.layers{right:10px;top:126px}h2{font-size:22px}}
</style>
</head>

<div class="app">

const screenNode=$("#screen"),pageTitle=$("#pageTitle"),pageInfo=$("#pageInfo"),popover=$("#popover");

const ANCHOR_SELECTOR='button,[data-go],[data-transition],a,input,select,textarea,h1,h2,h3,.card,.row,.msg,.listrow,.fold,.asset-slot,nav';

function describeAnchor(el){if(!el)return'页面空白处';const tag=el.tagName.toLowerCase();const label={button:'按钮',a:'链接',h1:'标题',h2:'标题',h3:'标题',nav:'导航',input:'输入框',select:'选择器',textarea:'文本域'}[tag]||(el.classList.contains('card')?'卡片':el.classList.contains('listrow')?'条目':el.classList.contains('msg')?'消息':el.classList.contains('fold')?'折叠区':tag);const text=(el.innerText||'').trim().replace(/\s+/g,' ').slice(0,20);return text?`${label}「${text}」`:label}
function pathOf(el){const path=[];let n=el;while(n&&n!==screenNode){const p=n.parentElement;if(!p)return null;path.unshift([...p.children].indexOf(n));n=p}return n===screenNode?path:null}

function saveReviews(){try{localStorage.setItem(REVIEW_KEY,JSON.stringify(reviewNotes))}catch(e){}}
function drawReviewMarkers(){let layer=screenNode.querySelector('.review-layer');if(!layer){layer=document.createElement('div');layer.className='review-layer';screenNode.appendChild(layer)}layer.innerHTML='';const cr=screenNode.getBoundingClientRect();reviewNotes.filter(n=>n.page===currentPage).forEach(note=>{let x=note.fx*screenNode.clientWidth,y=note.fy;const anchor=note.path&&locatePath(note.path);if(anchor){const r=anchor.getBoundingClientRect();x=r.left-cr.left+note.relX*r.width;y=r.top-cr.top+note.relY*r.height}const m=document.createElement('button');m.className='review-marker';m.dataset.layer='review';m.dataset.review=note.id;m.textContent=note.seq;m.style.left=Math.max(0,Math.min(x,screenNode.clientWidth-32))+'px';m.style.top=Math.max(0,y-13)+'px';m.style.display=reviewToggle.checked?'':'none';layer.appendChild(m)})}
function drawReviewList(){const list=$("#reviewList");if(!reviewNotes.length){list.innerHTML='<p class="muted" style="font-size:12px">还没有批注。点顶部「✎ 批注」进入批注模式。</p>';return}const by={};reviewNotes.forEach(n=>(by[n.page]??=[]).push(n));list.innerHTML=Object.entries(by).map(([p,ns])=>`<p class="kicker" style="margin:10px 0 2px">${pages[p]?.title||p}</p>`+ns.map(n=>`<div class="review-item"><b>${n.seq}</b> <span class="muted" style="font-size:12px">${n.anchorDesc}</span><p style="font-size:13px">${n.text}</p><button class="quiet" data-review-del="${n.id}" style="font-size:12px;padding:3px 8px">删除</button></div>`).join('')).join('')}
function openReviewEditor(d){pendingReview=d;popover.innerHTML=`<b>${d.id?'编辑批注':'新批注'}</b><p class="muted" style="font-size:12px;margin:6px 0">${d.anchorDesc}</p><textarea rows="3" id="reviewText" placeholder="写下要给 AI 的修改意见…">${d.text||''}</textarea><div class="button-row"><button class="primary" data-review-save>保存</button><button class="quiet" data-review-cancel>取消</button></div>`;popover.classList.remove('hidden');activePopoverAnchor=null;popover.style.left=Math.max(12,Math.min(d.clientX,innerWidth-popover.offsetWidth-12))+'px';popover.style.top=Math.max(12,Math.min(d.clientY,innerHeight-popover.offsetHeight-12))+'px';popover.querySelector('#reviewText').focus()}
function commitReview(text){if(!pendingReview)return;const v=text.trim();if(!v){pendingReview=null;closePopover();return}if(pendingReview.id){const n=reviewNotes.find(n=>n.id===pendingReview.id);if(n)n.text=v}else{reviewSeq++;reviewNotes.push({id:`r${Date.now()}`,seq:`R${reviewSeq}`,page:currentPage,path:pendingReview.path,relX:pendingReview.relX,relY:pendingReview.relY,fx:pendingReview.fx,fy:pendingReview.fy,anchorDesc:pendingReview.anchorDesc,text:v})}pendingReview=null;saveReviews();drawReviewMarkers();drawReviewList();closePopover()}
function openReviewNote(mk){const n=reviewNotes.find(n=>n.id===mk.dataset.review);if(!n)return;showPopover(mk,`<b>批注 ${n.seq}</b><p class="muted" style="font-size:12px;margin:6px 0">${n.anchorDesc}</p><p style="font-size:13px">${n.text}</p><div class="button-row"><button class="quiet" data-review-edit="${n.id}">编辑</button><button class="quiet" data-review-del="${n.id}">删除</button></div>`)}
function exportReviews(){const box=$("#reviewExport");if(!reviewNotes.length){box.classList.remove('hidden');box.textContent='还没有批注可导出。';return}const by={};reviewNotes.forEach(n=>(by[n.page]??=[]).push(n));let md=`# 线稿评审批注(共 ${reviewNotes.length} 条)\n\n这份 HTML 是单文件线稿原型:页面定义在 pages 对象,路由 data-go,迁移 data-transition,UX 说明在 notes。请按批注逐条修改:\n\n`;for(const[p,ns]of Object.entries(by)){md+=`## 页面「${pages[p]?.title||p}」(${p})\n\n`;ns.forEach(n=>{md+=`- ${n.seq} · 位置:${n.anchorDesc}\n  批注:${n.text}\n`});md+='\n'}box.classList.remove('hidden');box.textContent=md;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(md).then(()=>{box.textContent='已复制到剪贴板:\n\n'+md}).catch(()=>{})}
function closePopover(){popover.classList.add("hidden");activePopoverAnchor=null;pendingReview=null}
function applyLayers(){$$('[data-layer="ux"]').forEach(n=>n.style.display=uxToggle.checked?'':'none');$$('[data-layer="asset"]').forEach(n=>n.style.display=assetToggle.checked?'block':'none');$$('[data-layer="review"]').forEach(n=>n.style.display=reviewToggle.checked?'':'none');closePopover()}
function render(key){if(!pages[key])return;currentPage=key;screenNode.innerHTML=$("#page-"+key).innerHTML;pageTitle.textContent=pages[key].title;pageInfo.textContent=pages[key].info;$$('.nav button').forEach(n=>n.classList.toggle('active',n.dataset.go===key));drawReviewMarkers();applyLayers();inspector.classList.remove('open');inspectorButton.setAttribute('aria-expanded','false')}
function performTransition(id){const step=flows.flatMap(f=>f.transitions).find(t=>t.id===id);if(!step)return;if(currentPage!==step.from){console.warn(`Transition ${id} expected ${step.from},received ${currentPage}`);return}render(step.to)}
function drawJourney(){journeyBody.innerHTML=flows.map((f,i)=>`<div class="kicker">用户路径 ${i+1}</div><h3>${f.goal}</h3><p class="muted">${f.actor}</p><ol>${f.transitions.map(s=>`<li><b>${s.event}</b><br><span class="muted">${pages[s.from].title} → ${pages[s.to].title} · ${s.result}</span></li>`).join('')}</ol><p><b>完成之后:</b>${f.outcome}</p>`).join('<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">')}
function positionPopover(){if(!activePopoverAnchor)return;if(!activePopoverAnchor.isConnected){closePopover();return}const r=activePopoverAnchor.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight){closePopover();return}popover.style.left=Math.max(12,Math.min(r.right-popover.offsetWidth,innerWidth-popover.offsetWidth-12))+'px';popover.style.top=Math.max(12,Math.min(r.bottom+8,innerHeight-popover.offsetHeight-12))+'px'}
function showPopover(t,h){popover.innerHTML=h;popover.classList.remove('hidden');activePopoverAnchor=t;positionPopover()}
document.addEventListener('click',event=>{
 const rm=event.target.closest('[data-review]');if(rm){openReviewNote(rm);return}
 if(reviewMode&&screenNode.contains(event.target)){event.preventDefault();event.stopPropagation();closePopover();const anchor=findAnchor(event.target),cr=screenNode.getBoundingClientRect();let path=null,relX=0,relY=0;if(anchor){const r=anchor.getBoundingClientRect();path=pathOf(anchor);relX=(event.clientX-r.left)/r.width;relY=(event.clientY-r.top)/r.height}openReviewEditor({anchorDesc:describeAnchor(anchor),path,relX,relY,fx:(event.clientX-cr.left)/screenNode.clientWidth,fy:event.clientY-cr.top,clientX:event.clientX,clientY:event.clientY});return}
 const sb=event.target.closest('[data-review-save]');if(sb){commitReview(popover.querySelector('#reviewText')?.value||'');return}
 if(event.target.closest('[data-review-cancel]')){closePopover();return}
 const eb=event.target.closest('[data-review-edit]');if(eb){const n=reviewNotes.find(n=>n.id===eb.dataset.reviewEdit);if(n)openReviewEditor({id:n.id,anchorDesc:n.anchorDesc,text:n.text,clientX:innerWidth/2-150,clientY:innerHeight/3});return}
 const db=event.target.closest('[data-review-del]');if(db){reviewNotes=reviewNotes.filter(n=>n.id!==db.dataset.reviewDel);saveReviews();drawReviewMarkers();drawReviewList();closePopover();return}
 const note=event.target.closest('[data-note]'),asset=event.target.closest('[data-asset]');
 if(note){showPopover(note,`<b>UX ${note.textContent}</b><p>${notes[note.dataset.note]}</p>`);return}
 if(asset){const spec=assets[asset.dataset.asset];showPopover(asset,`<b>${asset.dataset.asset} · ${spec.name}</b><p>${spec.type} · ${spec.priority}</p><p>${spec.intent}</p><small>${spec.constraints}<br>复用:${spec.reuse}</small>`);return}
 const tr=event.target.closest('[data-transition]');if(tr){performTransition(tr.dataset.transition);return}
 const ro=event.target.closest('[data-go]');if(ro){render(ro.dataset.go);return}
 if(!event.target.closest('#popover'))closePopover();
 if(!event.target.closest('#layers')&&!event.target.closest('#layersButton'))layers.classList.remove('open');
 if(!event.target.closest('#inspector')&&!event.target.closest('#inspectorButton')){inspector.classList.remove('open');inspectorButton.setAttribute('aria-expanded','false')}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[tabindex="0"]')){e.preventDefault();e.target.click()}if(e.key==='Escape'){closePopover();layers.classList.remove('open');journey.classList.remove('open');inspector.classList.remove('open');inspectorButton.setAttribute('aria-expanded','false');if(reviewMode){reviewMode=false;document.body.classList.remove('review-mode')}}});
document.addEventListener('scroll',()=>{if(activePopoverAnchor)positionPopover()},{capture:true,passive:true});window.addEventListener('resize',()=>{if(activePopoverAnchor)positionPopover();drawReviewMarkers()});
reviewButton.onclick=()=>{reviewMode=!reviewMode;document.body.classList.toggle('review-mode',reviewMode);closePopover()};
$("#copyReview").onclick=exportReviews;
$("#layersButton").onclick=()=>layers.classList.toggle('open');$("#journeyButton").onclick=()=>journey.classList.add('open');$("#journeyClose").onclick=()=>journey.classList.remove('open');
inspectorButton.onclick=()=>{const o=inspector.classList.toggle('open');inspectorButton.setAttribute('aria-expanded',String(o))};$("#inspectorClose").onclick=()=>{inspector.classList.remove('open');inspectorButton.setAttribute('aria-expanded','false')};
uxToggle.onchange=applyLayers;assetToggle.onchange=applyLayers;reviewToggle.onchange=applyLayers;
function validateBlueprint(){const errors=[],ids=new Set(),states=new Set(Object.keys(pages));flows.flatMap(f=>f.transitions).forEach(s=>{if(!s.id||ids.has(s.id))errors.push('Dup transition id:'+s.id);ids.add(s.id);if(!states.has(s.from)||!states.has(s.to)||!s.event||!s.result)errors.push('Invalid transition:'+s.id);const tpl=$("#page-"+s.from);if(tpl&&!tpl.content.querySelector(`[data-transition="${s.id}"]`))errors.push('Transition '+s.id+' has no action on '+s.from)});const frags=[document,...Object.keys(pages).map(k=>new DOMParser().parseFromString($("#page-"+k).innerHTML,'text/html'))],all=s=>frags.flatMap(f=>[...f.querySelectorAll(s)]);all('[data-go]').forEach(n=>{if(!states.has(n.dataset.go))errors.push('Missing route:'+n.dataset.go)});all('[data-transition]').forEach(n=>{if(!ids.has(n.dataset.transition))errors.push('Missing transition:'+n.dataset.transition)});all('[data-note]').forEach(n=>{if(!notes[n.dataset.note])errors.push('Missing note:'+n.dataset.note)});all('[data-asset]').forEach(n=>{const spec=assets[n.dataset.asset];if(!spec||!spec.priority||!spec.intent||!spec.constraints||!spec.reuse)errors.push('Incomplete asset:'+n.dataset.asset)});const wired=new Set(['layersButton','inspectorButton','inspectorClose','journeyButton','journeyClose','reviewButton','copyReview','reviewText']);all('button').forEach(n=>{if(!(n.disabled||n.dataset.go||n.dataset.transition||n.dataset.note||n.dataset.asset||n.dataset.review||n.dataset.reviewDel!==undefined||n.dataset.reviewEdit!==undefined||n.dataset.reviewSave!==undefined||n.dataset.reviewCancel!==undefined||n.dataset.inert!==undefined||wired.has(n.id)||n.closest('#reviewList')))errors.push('Active button without behavior:'+n.textContent.trim().slice(0,30))});window.blueprintValidation={ok:!errors.length,errors};if(errors.length)console.error('Blueprint validation failed',errors);else console.info('Blueprint validation passed');return window.blueprintValidation}
render(currentPage);drawJourney();drawReviewList();validateBlueprint();
</script>
</body></html>
